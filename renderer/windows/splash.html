<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      background: black;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Background image */
    .bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Bottom overlay */
    .overlay {
      position: absolute;
      bottom: 36px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Progress bar container */
    .bar-container {
      width: 60%;
      height: 12px;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    /* Progress bar fill */
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      transition: width 0.15s ease;
    }
  </style>
</head>

<body>

  <!-- FIXED PATH (from renderer/windows → assets) -->
  <img class="bg" src="../../assets/splash.png" />

  <!-- Loading bar -->
  <div class="overlay">
    <div class="bar-container">
      <div class="bar" id="bar"></div>
    </div>
  </div>

  <script>
    let progress = 0;
    const bar = document.getElementById('bar');

    const interval = setInterval(() => {
      progress += Math.random() * 5;

      if (progress > 100) progress = 100;

      bar.style.width = progress + "%";

      if (progress === 100) {
        clearInterval(interval);
      }
    }, 120);
  </script>

</body>
</html>
